<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Discover how prepared your organization is for AI adoption with this free assessment.">
  <title>AI Readiness Assessment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- Top progress bar (visible during questions) -->
  <div id="progress-bar-wrap" class="fixed top-0 left-0 right-0 h-1.5 bg-gray-200 z-50 hidden">
    <div id="progress-bar" class="h-full bg-brand-600 transition-all duration-300 ease-out" style="width:0%"></div>
  </div>

  <!-- Main app mount -->
  <main id="app" class="flex-1 flex items-start justify-center px-4 py-8 sm:py-12">
    <div class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-500">Loading assessment&hellip;</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
